name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          # No cache: npm — package-lock.json is not committed yet.
          # Re-enable cache after generating and committing a lockfile.

      - name: Install dependencies
        run: npm install

      - name: Validate (tests + typecheck)
        run: npm run validate

      - name: Docs check
        run: npm run docs:check

      - name: Build
        run: npm run build
