<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
<title id="title">AgentCourt AI evidence intelligence architecture</title>
<desc id="desc">Digital evidence flows through verification and intelligence into a reviewable report and a human or protocol decision.</desc>
<rect width="1200" height="360" fill="#070a10"/>
<g font-family="Arial, sans-serif" fill="#e8edf7" text-anchor="middle">
<rect x="55" y="125" width="210" height="110" rx="18" fill="#0d121c" stroke="#34405a"/><text x="160" y="165" font-size="22">Digital Evidence</text><text x="160" y="195" font-size="14" fill="#9aa7ba">documents • chats • txs</text>
<rect x="345" y="125" width="210" height="110" rx="18" fill="#0d121c" stroke="#34405a"/><text x="450" y="165" font-size="22">Verification</text><text x="450" y="195" font-size="14" fill="#9aa7ba">provenance • hashes</text>
<rect x="635" y="125" width="210" height="110" rx="18" fill="#0d121c" stroke="#34405a"/><text x="740" y="165" font-size="22">Intelligence</text><text x="740" y="195" font-size="14" fill="#9aa7ba">timeline • conflicts</text>
<rect x="925" y="125" width="220" height="110" rx="18" fill="#0d121c" stroke="#34405a"/><text x="1035" y="165" font-size="22">Human Decision</text><text x="1035" y="195" font-size="14" fill="#9aa7ba">review • arbitration</text>
</g>
<g stroke="#8ea4ff" stroke-width="3" fill="none"><path d="M265 180h80"/><path d="M555 180h80"/><path d="M845 180h80"/></g>
